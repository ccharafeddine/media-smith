<!doctype html>
<html lang="en" data-app="clipsmith">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trim, reframe and export video clips in your browser. Nothing is uploaded." />
    <link rel="icon" type="image/svg+xml" href="./clipsmith.svg" />
    <title>ClipSmith web demo</title>
  </head>
  <body class="sm-app">
    <main class="page">
      <section class="stage">
        <label class="sm-drop drop-card" id="drop">
          <input type="file" id="file" accept="video/*,.mkv" hidden />
          <span class="sm-empty__art" aria-hidden="true">[ ]</span>
          <h3>Open a video to clip</h3>
          <p>Trim, reframe and export MP4, MP3 or GIF right here. The file never leaves this device.</p>
          <span class="sm-btn sm-btn--primary sm-btn--lg">Open video…</span>
          <small>MP4 · MOV · WEBM · MKV, up to 500 MB · or drop it anywhere</small>
          <button type="button" class="sm-btn sm-btn--ghost sm-btn--sm" id="sample">Try the sample clip</button>
        </label>
        <div class="player" id="player" hidden>
          <video id="video" controls playsinline></video>
        </div>
        <p class="meta sm-num" id="meta" hidden></p>
      </section>
      <aside class="panel sm-panel" id="panel" hidden>
        <div class="sm-panel__head">Trim</div>
        <div class="grid2">
          <label class="sm-field"><span>Start (s)</span><input class="sm-input sm-num" id="start" type="number" min="0" step="0.1" value="0" /></label>
          <label class="sm-field"><span>End (s)</span><input class="sm-input sm-num" id="end" type="number" min="0" step="0.1" value="0" /></label>
          <button type="button" class="sm-btn sm-btn--sm" id="setIn">Start at playhead</button>
          <button type="button" class="sm-btn sm-btn--sm" id="setOut">End at playhead</button>
        </div>
        <p class="hint sm-num" id="len"></p>
        <div class="sm-panel__head">Reframe</div>
        <div class="sm-seg" id="ratio" role="group"><button type="button" data-v="0" aria-pressed="true">Original</button><button type="button" data-v="0.5625" aria-pressed="false">9:16</button><button type="button" data-v="1" aria-pressed="false">1:1</button><button type="button" data-v="1.7778" aria-pressed="false">16:9</button></div>
        <div class="sm-panel__head">Format</div>
        <div class="sm-seg" id="fmt" role="group"><button type="button" data-v="mp4" aria-pressed="true">MP4 video</button><button type="button" data-v="mp3" aria-pressed="false">MP3 audio</button><button type="button" data-v="gif" aria-pressed="false">GIF</button></div>
        <p class="hint">MP4 is H.264 + AAC, up to 720p in the browser.</p>
        <button type="button" class="sm-btn sm-btn--primary sm-btn--lg go" id="go">Export clip</button>
        <div class="status" id="status" hidden><span class="st-text"></span><div class="sm-progress" hidden><i></i></div></div>
        <div class="result" id="result" hidden></div>
      </aside>
    </main>
    <script type="module" src="./src/clip.ts"></script>
  </body>
</html>
