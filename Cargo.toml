[workspace]
resolver = "2"
members = ["crates/ms-media", "crates/ms-import", "crates/ms-project", "crates/ms-ai", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ccharafeddine/media-smith"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
url = "2"
