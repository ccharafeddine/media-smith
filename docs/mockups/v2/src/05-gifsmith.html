<!doctype html><html data-app="gifsmith"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../packages/ui/src/tokens.css"><link rel="stylesheet" href="../../../../packages/ui/src/components.css"><link rel="stylesheet" href="v2.css"></head><body class="sm-app"><header class="sm-topbar"><span class="sm-wordmark"><img src="../../../../packages/ui/src/brand/gifsmith.svg"><span><span class="app">Gif</span><span class="smith">Smith</span></span></span><span style="width:1px;height:20px;background:var(--line-2)"></span><div class="steps"><span><b>1. Choose clip</b></span><span>›</span><span>2. Tune</span><span>›</span><span>3. Export</span></div><span class="sp"></span><button class="sm-btn sm-btn--ghost sm-btn--icon">⚙</button><button class="sm-btn sm-btn--ghost">Open in MediaSmith ↗</button></header><div class="shell"><div class="stage" style="padding:24px 32px;gap:16px"><div class="canvaswrap" style="flex:1"><div class="canvas" style="height:auto;width:640px;aspect-ratio:4/3"><div class="scene"></div><div class="sun"></div><div class="figure"></div><div class="cap" style="font-size:34px">when it <span class="hl">lands</span></div></div></div><div class="row"><span class="sm-chip sm-chip--hue">↻ Loop 2.4 s</span><span class="sm-chip">Ping-pong</span><span class="sp"></span><span class="sm-num muted">frame 18 / 36</span></div><div class="film"><div class="win" style="left:30%;width:16%"></div></div></div><aside class="insp" style="width:340px"><div class="sm-panel__head">GIF</div><div class="sec"><h4>Size limit</h4><div class="sm-seg"><button>Discord 10 MB</button><button aria-pressed="true">Slack 5 MB</button><button>Custom</button></div><label class="row" style="font-size:12px"><input type="checkbox" checked> Shrink to fit the limit</label></div><div class="sec"><h4>Quality</h4><label class="sm-field"><span>Width · 480 px</span><div class="slider"><i style="width:48%"></i><b style="left:48%"></b></div></label><label class="sm-field"><span>Frame rate · 15 fps</span><div class="slider"><i style="width:50%"></i><b style="left:50%"></b></div></label><label class="sm-field"><span>Colors · 128</span><div class="slider"><i style="width:50%"></i><b style="left:50%"></b></div></label></div><div class="sec"><h4>Text</h4><input class="sm-input" value="when it lands"></div><div class="sec"><div class="row" style="font-size:12px"><span class="muted">Estimated</span><span class="sp"></span><b class="sm-num">3.8 MB</b><span class="sm-chip" style="color:var(--ok)">fits</span></div><button class="sm-btn sm-btn--primary sm-btn--lg">◎ Make GIF</button></div></aside></div></body></html>
