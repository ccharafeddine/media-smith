[package]
name = "mediasmith"
description = "MediaSmith desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mediasmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
ms-media = { path = "../../crates/ms-media" }
ms-import = { path = "../../crates/ms-import" }
ms-project = { path = "../../crates/ms-project" }
ms-ai = { path = "../../crates/ms-ai" }
ms-captions = { path = "../../crates/ms-captions" }
