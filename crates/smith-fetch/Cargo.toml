[package]
name = "smith-fetch"
description = "Shared URL download engine for the Smith apps (ClipSmith, GifSmith, MediaSmith): yt-dlp with self-update, generic page scraping, HLS/DASH remux, cookies and sniff-mode helpers. No DRM circumvention."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ccharafeddine/media-smith"

[features]
default = []
# Tauri glue: commands, the browse/sniff window, cookie capture, clipboard watcher.
tauri = ["dep:tauri", "dep:arboard", "dep:webview2-com", "dep:windows"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["process", "time", "macros", "io-util", "fs", "rt", "sync", "rt-multi-thread"] }
flate2 = "1"
tauri = { version = "2", optional = true }
arboard = { version = "3", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }

[[bin]]
name = "smith-fetch-smoke"
path = "src/bin/smoke.rs"
